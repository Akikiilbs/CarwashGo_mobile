name: carwashgo
description: A Flutter project for CarWashGo app.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  dio: ^5.7.0
  flutter_secure_storage: ^9.0.0
  flutter:
    sdk: flutter

  # ===== UI & Icons =====
  cupertino_icons: ^1.0.6
  iconsax: ^0.0.8
  google_fonts: ^6.2.1

  # ===== State Management =====
  provider: ^6.1.2

  # ===== Notifikasi =====
  fluttertoast: ^8.2.4

  # ===== Animasi =====
  animations: ^2.0.8

  # ===== MAP =====
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # ===== GPS / LOCATION =====
  geolocator: ^9.0.2
  geolocator_web: ^4.1.3

  # ===== FILE PICKER =====
  file_picker: ^6.1.1

  # ===== OPEN GOOGLE MAPS =====
  url_launcher: ^6.2.5   # <==== FIX TERPENTING

dependency_overrides:
  geolocator_web: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
